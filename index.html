<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia das Mães ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="particles" id="particles"></div>

    <header class="hero">
        <div class="hero-content">
            <h1>Feliz Dia das Mães ❤️</h1>
               <img src="images/mamae1.jpeg" class="hero-img" alt="presente fofo">

            
            <p>Uma homenagem especial pra você, mãe 💖</p>
            <button onclick="scrollToSection('mensagem')">Ver mensagem</button>
           <div class="espaco"></div>
        </div>

        
    </header>

    <section id="mensagem" class="section">
        <h2>Minha mensagem</h2>
        <p>
            Mãe, você é meu maior exemplo de amor, força e carinho.
            Obrigado por tudo que você faz por mim todos os dias.
            Te amo infinitamente ❤️
        </p>
    </section>

    <section class="section">
        <h2>Galeria</h2>

        <div class="galeria">
            <img src="images/mamae2.jpeg" onclick="abrirImagem(this.src)">
            <img src="images/mamae3.jpeg" onclick="abrirImagem(this.src)">
            <img src="images/mamae4.jpeg" onclick="abrirImagem(this.src)">
        </div>
    </section>

    <div id="modal" class="modal" onclick="fecharModal()">
        <img id="imgModal">
    </div>

    <footer>
        <p>Feito com ❤️ para minha mãe</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
