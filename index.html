<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Dia das Mães ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fundo de flores -->
    <div class="particles" id="particles"></div>

    <!-- Hero -->
    <header class="hero">
        <h1>Feliz Dia das Mães ❤️</h1>
        <p>Uma homenagem especial para você</p>

        <button onclick="mostrarMensagem()">
            Abrir Homenagem 💌
        </button>
    </header>

    <!-- Mensagem (começa escondida) -->
    <section id="mensagem" class="section hidden">
        <h2>Minha mensagem</h2>
        <p>
            Mãe, você é meu maior exemplo de amor, força e carinho.
            Obrigado por tudo que você faz por mim todos os dias.
            Te amo infinitamente ❤️
        </p>
    </section>

    <!-- Galeria -->
    <section class="section">
        <h2>Memórias</h2>

        <div class="galeria">
            <img src="images/foto1.jpg" onclick="abrirImagem(this.src)">
            <img src="images/foto2.jpg" onclick="abrirImagem(this.src)">
            <img src="images/foto3.jpg" onclick="abrirImagem(this.src)">
        </div>
    </section>

    <!-- Modal -->
    <div id="modal" onclick="fecharModal()">
        <img id="imgModal">
    </div>

    <footer>
        Feito com ❤️
    </footer>

    <script src="script.js"></script>
</body>
</html>
