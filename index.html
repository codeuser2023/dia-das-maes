<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dia das Mães ❤️</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="particles" id="particles"></div>

<header class="hero">
    <h1>Feliz Dia das Mães ❤️</h1>
    <p>Uma homenagem especial</p>

    <button onclick="abrirMensagem()">Abrir presente 💌</button>
</header>

<section id="mensagem" class="mensagem">
    <h2>Minha mensagem</h2>
    <p>
        Mãe, obrigado por tudo que você faz por mim.
        Você é meu maior amor ❤️
    </p>
</section>

<section class="galeria">
    <img src="images/foto1.jpg" onclick="abrirImg(this.src)">
    <img src="images/foto2.jpg" onclick="abrirImg(this.src)">
    <img src="images/foto3.jpg" onclick="abrirImg(this.src)">
</section>

<div id="modal" onclick="fecharModal()">
    <img id="modalImg">
</div>

<script src="script.js"></script>
</body>
</html>
